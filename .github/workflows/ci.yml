name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Authoritative Release Verification (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install ripgrep for E2E search
        shell: powershell
        run: choco install ripgrep -y --no-progress

      - name: Run authoritative verification gate
        shell: powershell
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-release.ps1 *>&1 | Tee-Object -FilePath release-verification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-log-${{ github.sha }}
          path: release-verification.log
          if-no-files-found: error
          retention-days: 7

      - name: Annotate release verification failure
        if: failure()
        shell: powershell
        run: |
          if (Test-Path -LiteralPath release-verification.log) {
            $diagnosticLines = Get-Content -LiteralPath release-verification.log |
              Where-Object { $_ -match '==>|Release stage|failed|error|Error|ERROR|FAIL|ERR_|EBUSY|EPERM|ENOTEMPTY|Exit status|OperationStopped|CategoryInfo|FullyQualifiedId|Test Files|Tests ' } |
              Select-Object -Last 80
            if ($diagnosticLines.Count -eq 0) {
              $diagnosticLines = Get-Content -LiteralPath release-verification.log | Select-Object -Last 25
            }
            $diagnosticMessage = [string]::Join(' | ', $diagnosticLines)
            Write-Host "::error::$diagnosticMessage"
          }

      - name: Upload verified Windows release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: |
            apps/desktop/dist/installers/*.exe
            apps/desktop/dist/installers/*.blockmap
            apps/desktop/dist/installers/latest.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
